services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: vllm-gpt-oss-20b
    restart: unless-stopped
    ports:
      - "8001:8000"
    ipc: host
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    command: >
      --model ${VLLM_HF_REPO:-openai/gpt-oss-20b}
      --served-model-name ${VLLM_MODEL:-gpt-oss:20b}
      --gpu-memory-utilization 0.85
      --max-model-len 8192
      --enable-auto-tool-choice
      --tool-call-parser hermes
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
